<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next SI AI</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1224;
  color:white;
}
header {
  background:#111d35;
  padding:20px;
  text-align:center;
}
h1 {color:#51c7ff}
.container {
  max-width:700px;
  margin:40px auto;
  padding:20px;
}
.chatbox {
  background:#172642;
  padding:20px;
  border-radius:12px;
}
#messages {
  height:300px;
  overflow-y:auto;
  padding:10px;
}
input {
  width:70%;
  padding:13px;
  border-radius:7px;
  border:0;
}
button {
  padding:13px;
  background:#168bd1;
  color:white;
  border:0;
  border-radius:7px;
  cursor:pointer;
}
footer {
  text-align:center;
  padding:20px;
}
</style>
</head>

<body>

<header>
<h1>Next SI</h1>
<p>Your AI Technology Platform</p>
</header>

<div class="container">
<div class="chatbox">

<h2>🤖 Next SI AI</h2>
<p>Ask anything!</p>

<div id="messages">
<p>🤖 Hello! Welcome to Next SI AI.</p>
</div>

<input id="question"
placeholder="Type your question...">

<button onclick="sendMessage()">Send</button>
<button onclick="clearChat()">Clear</button>

</div>
</div>

<footer>
© 2026 Next SI
</footer>

<script>
function sendMessage() {
 let input = document.getElementById("question");
 let message = input.value.trim();

 if(message === "") return;

 let box = document.getElementById("messages");

 box.innerHTML +=
 "<p>👤 You: " + escapeHTML(message) + "</p>";

 box.innerHTML +=
 "<p>🤖 Next SI AI: आपका सवाल मिल गया है। वास्तविक AI जवाब देने की सुविधा जल्द जोड़ी जाएगी।</p>";

 input.value = "";
 box.scrollTop = box.scrollHeight;
}

function clearChat() {
 document.getElementById("messages").innerHTML = "";
}

function escapeHTML(text) {
 return text.replace(/[&<>"']/g, function(c) {
  return {
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c];
 });
}
</script>

</body>
</html>
